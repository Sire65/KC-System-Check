name: Tests
on: [push, pull_request]
jobs:
  js-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [cloudflare-edge, backup-telemetry-edge-sanitizer, alarm-chain, alarm-policy, alarm-push-calibration, backup-state, backup-telemetry-ingest, backup-vault-adapter, backup-vault-manual, datenfluss, db-monitor-package, desktop-layout, early-warning, flow-live-v4-hotfix, flow-live-v4, health-assistant, heartbeat-package, kasse-interval-traffic, kc-system-check-neon-wakeup, leitstand-program-monitor, live-derived-flows, live-layout, mail-values-program-health, mirror-detail, mirror-efficiency, monitor-contract, monitoring-runs-sync, neon-compute-budget, neon-mirror-wakeup, programs-heartbeat, public-exposure, quality-tools, release-hardening, runtime-config, safe-html, security-reviewed-exceptions-edge, security-reviewed-exceptions, selection-visibility, status-model, storage-backup-live, trace-context, updater]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run ${{ matrix.test }}
        run: |
          node --test tests/${{ matrix.test }}.test.js 2>&1 | tee test-output.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### ${{ matrix.test }} failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Archive gateway regression tests
        run: node --test tests/archive-gateway.test.mjs
      - name: Local updater regression check
        run: node tests/local-remote-update-check.test.mjs
      - name: Frontend syntax
        run: |
          for f in js/*.js js/adapters/*.js; do node --check "$f"; done
      - name: ESLint external static analysis
        run: |
          npx --yes eslint@10.9.1 js --no-config-lookup \
            --rule 'no-unreachable:error' \
            --rule 'no-dupe-keys:error' \
            --rule 'no-duplicate-case:error'
      - name: esbuild external module bundle check
        run: npx --yes esbuild@0.25.10 js/app.js --bundle --format=esm --platform=browser --outfile=/tmp/kc-system-check.bundle.js
      - name: Release contract
        run: |
          grep -q 'id="appVersion"' index.html
          VERSION=$(node -p "require('./version.json').version")
          test -n "$VERSION"
          grep -q "kc-system-check-v${VERSION}" sw.js
          grep -q "CURRENT_VERSION=\"${VERSION}\"" js/updater.js
          grep -q "VERSION='${VERSION}'" js/kicc-heartbeat.js
          node -e "const v=require('./version.json'); if(v.channel==='stable'&&v.verbindlich!==true) process.exit(1); if(v.channel==='beta'&&v.verbindlich!==false) process.exit(1)"
          grep -q 'cp -R js dist/js' .github/workflows/pages.yml
          grep -q 'growthWindow' js/usage.js
          grep -q 'ASVS' js/verification-profile.js
          grep -q '100% bedeutet 100% der definierten' js/verification-profile.js
          grep -q 'keine absolute Fehlerfreiheitsgarantie' docs/VERIFICATION_PROFILE.md
      - name: Playwright installieren
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/kc-http.log 2>&1 &
      - name: Playwright mobile smoke TÜV
        run: npx playwright test tests/external-smoke.spec.js --grep "Mobile 390x844" --reporter=line --workers=1
      - name: Playwright desktop smoke TÜV
        run: npx playwright test tests/external-smoke.spec.js --grep "Desktop 1440x900" --reporter=line --workers=1
      - name: Playwright hardening TÜV
        id: playwright_hardening
        run: npx playwright test tests/hardening-smoke.spec.js --reporter=line --workers=1
      - name: Playwright live access TÜV
        id: playwright_live
        run: npx playwright test tests/live-access.spec.js --reporter=line --workers=1

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen und Serverfunktionen gegen PostgreSQL pruefen
        run: tests/sql/run.sh