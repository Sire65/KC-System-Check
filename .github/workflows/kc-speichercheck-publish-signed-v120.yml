name: KC SpeicherCheck signierte v1.2.0 veröffentlichen

on:
  push:
    paths:
      - '.github/workflows/kc-speichercheck-publish-signed-v120.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Signiertes Release laden
        run: |
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-61c0-8210-ada5-19c719238567/raw?se=2026-09-27T06%3A57%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=ae8647de-64c8-5077-9187-4dbb2532082f&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T06%3A20%3A24Z&ske=2026-09-28T06%3A20%3A24Z&sks=b&skv=2026-02-06&sig=tdS5%2BRJqzMk/7KHB%2B7KOXcJ7v2TQsPESd0x%2BAoimQag%3D' -o /tmp/kc-signed.zip
          mkdir -p /tmp/kc-signed
          unzip -o /tmp/kc-signed.zip -d /tmp/kc-signed
          test -f /tmp/kc-signed/KC-SpeicherCheck-v1.2.0.apk
          echo '877c267e13948a110e7e3ac2b7a427d8e9605e6857efc65febd97eb526a71018  /tmp/kc-signed/KC-SpeicherCheck-v1.2.0.apk' | sha256sum -c -

      - name: APK in öffentlichen Downloadbereich legen
        run: |
          mkdir -p downloads
          cp /tmp/kc-signed/KC-SpeicherCheck-v1.2.0.apk downloads/KC-SpeicherCheck-v1.2.0.apk
          echo '877c267e13948a110e7e3ac2b7a427d8e9605e6857efc65febd97eb526a71018  downloads/KC-SpeicherCheck-v1.2.0.apk' > downloads/KC-SpeicherCheck-v1.2.0.sha256.txt

      - name: Veröffentlichung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/KC-SpeicherCheck-v1.2.0.apk downloads/KC-SpeicherCheck-v1.2.0.sha256.txt
          git commit -m "KC SpeicherCheck v1.2.0 stabil signiert veröffentlichen [skip ci]"
          git push
