name: KC SpeicherCheck signierte v1.2.1 veröffentlichen

on:
  push:
    paths:
      - '.github/workflows/kc-speichercheck-publish-signed-v121.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Signiertes Release laden und prüfen
        run: |
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f4f0-8210-8fc6-c1998880ba13/raw?se=2026-09-27T07%3A09%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=5ad6fc43-743b-5343-865f-d93e0ca19816&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T04%3A49%3A55Z&ske=2026-09-28T04%3A49%3A55Z&sks=b&skv=2026-02-06&sig=xaJqkWoERwgb/yudEfUj7b8shzikW3MthXcu3FJn81U%3D' -o /tmp/kc-signed.zip
          rm -rf /tmp/kc-signed
          mkdir -p /tmp/kc-signed
          unzip -o /tmp/kc-signed.zip -d /tmp/kc-signed
          test -f /tmp/kc-signed/KC-SpeicherCheck-v1.2.1.apk
          echo '5e2fb52be16a462d23f1033a31793d75902ee3c21396368bf8faf98f77c445d4  /tmp/kc-signed/KC-SpeicherCheck-v1.2.1.apk' | sha256sum -c -

      - name: APK veröffentlichen
        run: |
          mkdir -p downloads
          cp /tmp/kc-signed/KC-SpeicherCheck-v1.2.1.apk downloads/KC-SpeicherCheck-v1.2.1-STABIL.apk
          echo '5e2fb52be16a462d23f1033a31793d75902ee3c21396368bf8faf98f77c445d4  downloads/KC-SpeicherCheck-v1.2.1-STABIL.apk' > downloads/KC-SpeicherCheck-v1.2.1-STABIL.sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/KC-SpeicherCheck-v1.2.1-STABIL.apk downloads/KC-SpeicherCheck-v1.2.1-STABIL.sha256.txt
          git commit -m "KC SpeicherCheck v1.2.1 stabil signiert veröffentlichen [skip ci]"
          git push
