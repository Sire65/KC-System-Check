name: Totmannschalter

# Bewusst unabhaengig vom ueberwachten System: faellt der taegliche Pruflauf
# aus, schlaegt dieser Job fehl und GitHub meldet sich. Ein Monitoring, das
# schweigt weil es tot ist, sieht sonst aus wie "alles in Ordnung".
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Alter des juengsten protokollierten Pruflaufs pruefen
        shell: bash
        run: |
          set -euo pipefail
          MAX_AGE_MINUTES=1500
          URL=$(jq -r '.apiBaseUrl' config/runtime.public.json)
          TOKEN=$(jq -r '.apiToken' config/runtime.public.json)
          BODY=$(curl --fail --silent --show-error --retry 2 --max-time 45 \
            -H "Authorization: Bearer ${TOKEN}" -H "apikey: ${TOKEN}" \
            "${URL}?history=1")
          LAST=$(echo "${BODY}" | jq -r '.history[0].checked_at // empty')
          if [ -z "${LAST}" ]; then
            echo "::error::Kein einziger protokollierter Pruflauf gefunden."
            exit 1
          fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "${LAST}" +%s) ) / 60 ))
          echo "Juengster Lauf: ${LAST} (vor ${AGE} Minuten)"
          if [ "${AGE}" -gt "${MAX_AGE_MINUTES}" ]; then
            echo "::error::Seit ${AGE} Minuten kein Pruflauf. Der KC System Check meldet sich nicht mehr."
            exit 1
          fi
          echo "Totmannschalter in Ordnung."
