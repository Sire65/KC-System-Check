name: KC SpeicherCheck v1.3.6 veröffentlichen

on:
  push:
    paths:
      - '.github/workflows/kc-speichercheck-publish-v136.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Signiertes Paket laden und prüfen
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8d58-8246-9235-65cbbc284c70/raw?se=2026-09-27T12%3A49%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=17f61a07-07d2-552d-a419-43c3370553e8&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T08%3A11%3A48Z&ske=2026-09-28T08%3A11%3A48Z&sks=b&skv=2026-02-06&sig=fxwkDNdaoJINxDtHojryaClKgAloZg78lcW6cBNa5EI%3D' -o /tmp/kc-v136-signed.zip
          rm -rf /tmp/kc-v136
          mkdir -p /tmp/kc-v136
          unzip -o /tmp/kc-v136-signed.zip -d /tmp/kc-v136
          test -f /tmp/kc-v136/KC-SpeicherCheck-v1.3.6.apk
          echo '1c59cdccfc405c45b3905d7a5678661dd7fb3ea75d1bf69e560a767d1e77224c  /tmp/kc-v136/KC-SpeicherCheck-v1.3.6.apk' | sha256sum -c -

      - name: Signatur mit stabiler v1.3.5 vergleichen
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          NEW_INFO="$("$APKSIGNER" verify --print-certs /tmp/kc-v136/KC-SpeicherCheck-v1.3.6.apk)"
          OLD_INFO="$("$APKSIGNER" verify --print-certs downloads/KC-SpeicherCheck-v1.3.5-STABIL.apk)"
          NEW_CERT="$(printf '%s\n' "$NEW_INFO" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1)"
          OLD_CERT="$(printf '%s\n' "$OLD_INFO" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1)"
          test -n "$NEW_CERT"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo "Signatur kompatibel: $NEW_CERT"

      - name: Stabiles Update veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kc-v136/KC-SpeicherCheck-v1.3.6.apk downloads/KC-SpeicherCheck-v1.3.6-STABIL.apk
          echo '1c59cdccfc405c45b3905d7a5678661dd7fb3ea75d1bf69e560a767d1e77224c  downloads/KC-SpeicherCheck-v1.3.6-STABIL.apk' > downloads/KC-SpeicherCheck-v1.3.6-STABIL.sha256.txt
          cat > android/kc-speichercheck/update.json <<'JSON'
          {
            "versionCode": 14,
            "versionName": "1.3.6",
            "apkUrl": "https://raw.githubusercontent.com/Sire65/KC-System-Check/main/downloads/KC-SpeicherCheck-v1.3.6-STABIL.apk",
            "sha256": "1c59cdccfc405c45b3905d7a5678661dd7fb3ea75d1bf69e560a767d1e77224c",
            "notes": "Neu: Vollständige Archivdiagnose im Bericht. Alle erreichbaren ZIP/RAR/7Z/TAR/GZ/TGZ/BZ2/XZ/APK/AAB werden mit Pfad, Größe und Bewertung aufgeführt. Archive in ansonsten übersprungenen Build-/Projektordnern werden diagnostisch mit erfasst. Automatische Löschregeln bleiben unverändert vorsichtig.",
            "published": "2026-09-27"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/KC-SpeicherCheck-v1.3.6-STABIL.apk downloads/KC-SpeicherCheck-v1.3.6-STABIL.sha256.txt android/kc-speichercheck/update.json
          git commit -m "KC SpeicherCheck v1.3.6 signiert veröffentlichen [skip ci]"
          git push
