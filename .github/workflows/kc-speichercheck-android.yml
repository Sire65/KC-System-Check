name: KC SpeicherCheck Android

on:
  push:
    paths:
      - 'android/kc-speichercheck/**'
      - '.github/workflows/kc-speichercheck-android.yml'
  pull_request:
    paths:
      - 'android/kc-speichercheck/**'
      - '.github/workflows/kc-speichercheck-android.yml'

concurrency:
  group: kc-speichercheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug-APK bauen
        run: gradle -p android/kc-speichercheck clean assembleDebug

      - name: Signaturkompatibilität zur stabilen Vorversion prüfen
        shell: bash
        run: |
          set -euo pipefail
          NEW_APK="android/kc-speichercheck/app/build/outputs/apk/debug/app-debug.apk"
          OLD_APK="downloads/KC-SpeicherCheck-v1.3.5-STABIL.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          NEW_INFO="$("$APKSIGNER" verify --print-certs "$NEW_APK")"
          OLD_INFO="$("$APKSIGNER" verify --print-certs "$OLD_APK")"
          NEW_CERT="$(printf '%s\n' "$NEW_INFO" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1)"
          OLD_CERT="$(printf '%s\n' "$OLD_INFO" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1)"
          echo "Neue APK Zertifikatsdaten:"
          printf '%s\n' "$NEW_INFO"
          echo "Stabile v1.3.5 Zertifikatsdaten:"
          printf '%s\n' "$OLD_INFO"
          echo "Neue APK Signatur: $NEW_CERT"
          echo "Stabile v1.3.5 Signatur: $OLD_CERT"
          test -n "$NEW_CERT"
          test -n "$OLD_CERT"
          if [ "$NEW_CERT" = "$OLD_CERT" ]; then
            echo "SIGNATURE_COMPATIBLE=true"
          else
            echo "SIGNATURE_COMPATIBLE=false"
          fi

      - name: Test-APK als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: KC-SpeicherCheck-debug
          path: android/kc-speichercheck/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
