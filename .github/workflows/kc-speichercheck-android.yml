name: KC SpeicherCheck Android

on:
  push:
    paths:
      - 'android/kc-speichercheck/**'
      - '.github/workflows/kc-speichercheck-android.yml'
  pull_request:
    paths:
      - 'android/kc-speichercheck/**'
      - '.github/workflows/kc-speichercheck-android.yml'

concurrency:
  group: kc-speichercheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Java 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Debug-APK bauen
        run: gradle -p android/kc-speichercheck clean assembleDebug

      - name: Test-APK als Artefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KC-SpeicherCheck-debug
          path: android/kc-speichercheck/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
