name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static PWA
        run: |
          rm -rf dist
          mkdir -p dist/icons dist/config dist/db-monitor
          cp index.html diagnose.html manifest.webmanifest sw.js version.json dist/
          # Die komplette JS-Struktur wird ausgeliefert. Eine feste Dateiliste hat
          # bei neuen Modulen bereits mehrfach zu einer formal erfolgreichen,
          # aber im Browser unvollständigen Veröffentlichung geführt.
          cp -R js dist/js
          cp icons/icon-192.svg icons/icon-512.svg dist/icons/
          cp config/runtime.public.json dist/config/runtime.json
          cp config/alarm-policy.json dist/config/alarm-policy.json
          cp share/db-monitor/install.sql share/db-monitor/README.md dist/db-monitor/
          mkdir -p dist/heartbeat
          cp share/heartbeat/kc-heartbeat.js share/heartbeat/README.md dist/heartbeat/
          test -f dist/js/safe-html.js
          test -f dist/js/session.js
          test -f dist/js/alarm-policy.js
          test -f dist/config/alarm-policy.json
          test -f dist/js/runtime-config.js
          test -f dist/js/startup-modules.js
          test -f dist/js/usage.js
          test -f dist/js/diagnostics.js
          test -f dist/js/diagnostics-runtime.js
          test -f dist/js/leitstand.js
          test -f dist/js/health-assistant.js
          test -f dist/js/early-warning.js
          test -f dist/js/self-check.js
          test -f dist/js/kicc-heartbeat.js
          test -f dist/js/quality-tools.js
          test -f dist/js/mobile-compact.js
          test -f dist/js/desktop-layout.js
          test -f dist/js/verification-profile.js
          test -f dist/js/alert-settings.js
          test -f dist/js/delivery-proof.js
          test -f dist/js/action-progress.js
          test -f dist/js/remote-operations.js
          test -f dist/diagnose.html
          test -f dist/config/runtime.json
          test -f dist/db-monitor/install.sql
          test -f dist/heartbeat/kc-heartbeat.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4