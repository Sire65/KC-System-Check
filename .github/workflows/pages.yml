name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static PWA
        run: |
          rm -rf dist
          mkdir -p dist/js/adapters dist/icons dist/config
          cp index.html diagnose.html manifest.webmanifest sw.js version.json dist/
          cp js/app.js js/state.js js/charts.js js/gauges.js js/updater.js js/usage.js js/diagnostics.js js/diagnostics-runtime.js js/leitstand.js js/health-assistant.js js/early-warning.js js/self-check.js js/kicc-heartbeat.js js/quality-tools.js js/mobile-compact.js js/desktop-layout.js js/verification-profile.js js/alert-settings.js js/delivery-proof.js js/health-empty-guard.js js/action-progress.js dist/js/
          cp js/adapters/base.js js/adapters/demo.js js/adapters/live.js dist/js/adapters/
          cp icons/icon-192.svg icons/icon-512.svg dist/icons/
          cp config/runtime.public.json dist/config/runtime.json
          test -f dist/js/usage.js
          test -f dist/js/diagnostics.js
          test -f dist/js/diagnostics-runtime.js
          test -f dist/js/leitstand.js
          test -f dist/js/health-assistant.js
          test -f dist/js/early-warning.js
          test -f dist/js/self-check.js
          test -f dist/js/kicc-heartbeat.js
          test -f dist/js/quality-tools.js
          test -f dist/js/mobile-compact.js
          test -f dist/js/desktop-layout.js
          test -f dist/js/verification-profile.js
          test -f dist/js/alert-settings.js
          test -f dist/js/delivery-proof.js
          test -f dist/js/health-empty-guard.js
          test -f dist/js/action-progress.js
          test -f dist/diagnose.html
          test -f dist/config/runtime.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
