<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC System Check Diagnose</title><style>body{font-family:system-ui,Arial,sans-serif;background:#0b1220;color:#f5f7fb;margin:0;padding:18px}h1{font-size:24px}.row{padding:12px;margin:8px 0;border-radius:12px;background:#111a2d;border:1px solid #273552}.ok{border-color:#2ecc71}.bad{border-color:#ef5a5a}.warn{border-color:#f3c34d}.muted{color:#9ba7bd;font-size:13px;white-space:pre-wrap;word-break:break-word}button{padding:12px 16px;border:0;border-radius:10px;background:#5aa7ff;color:#fff;font-weight:700}</style></head><body><h1>KC System Check · Startdiagnose</h1><p class="muted">Die Module werden einzeln geladen. Bei einem Fehler erscheint die exakte Meldung direkt hier.</p><button id="run">Diagnose starten</button><div id="out"></div><script type="module">const mods=['./js/health-assistant.js','./js/early-warning.js','./js/self-check.js','./js/kicc-heartbeat.js','./js/state.js','./js/adapters/base.js','./js/adapters/demo.js','./js/adapters/live.js','./js/gauges.js','./js/charts.js','./js/updater.js','./js/leitstand.js','./js/usage.js','./js/quality-tools.js'];const out=document.querySelector('#out');function add(name,ok,detail=''){const d=document.createElement('div');d.className='row '+(ok?'ok':'bad');d.innerHTML='<strong>'+name+'</strong><div>'+(ok?'OK':'FEHLER')+'</div><div class="muted"></div>';d.querySelector('.muted').textContent=detail;out.appendChild(d)}async function run(){out.innerHTML='';for(const m of mods){try{await import(m+'?diag='+Date.now());add(m,true)}catch(e){add(m,false,(e&&e.stack)||String(e));break}}}document.querySelector('#run').onclick=run;run();</script></body></html>
